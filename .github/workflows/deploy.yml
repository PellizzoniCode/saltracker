name: Deploy

# A merge (push) to develop deploys the dev stack, runs the smoke test and
# publishes the frontend. Credentials come from GitHub OIDC; see docs/ci-cd.md.
#
# Production is not deployed from here yet. The prod job (GitHub Environment with
# required reviewers, then a health check) is in git history at 5137944 and is
# described in docs/ci-cd.md under "Enabling prod".
on:
  push:
    branches: [develop]

permissions:
  contents: read

# One deploy at a time; a queued run waits instead of cancelling a deploy mid-flight.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: it would change the OIDC subject to
    # environment:<name>, which the dev role does not trust (it trusts the branch).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-stack
        with:
          environment: dev
          role-arn: ${{ vars.AWS_DEV_ROLE_ARN }}
          artifact-bucket: ${{ vars.SAM_ARTIFACT_BUCKET }}
          permissions-boundary-arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
          photo-upload-origins: ${{ vars.DEV_PHOTO_UPLOAD_ORIGINS }}
          amplify-app-id: ${{ vars.DEV_AMPLIFY_APP_ID }}
          amplify-branch: ${{ vars.DEV_AMPLIFY_BRANCH }}

  smoke-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: us-east-1
      - name: Smoke test
        run: python scripts/smoke_test.py --env dev --output smoke-test-results.md
      - name: Add report to the run summary
        if: always()
        run: '[ -f smoke-test-results.md ] && cat smoke-test-results.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-results
          path: smoke-test-results.md
          if-no-files-found: ignore
