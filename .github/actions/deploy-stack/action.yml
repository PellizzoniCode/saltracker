name: Deploy stack
description: >-
  Assume the environment's AWS deploy role over OIDC, then build and deploy the
  SAM stack. The frontend is published separately by the publish-frontend
  action, after the smoke test. The caller must check out the repo first and
  grant the job `id-token: write`.

inputs:
  environment:
    description: Stack environment (dev or prod); the stack is smart-asset-tracker-<environment>
    required: true
  account-id:
    description: >-
      12-digit id of the AWS account that holds the bootstrap stack. Pass it from a
      repository secret so it is masked in the (public) logs. The deploy role, SAM
      artifact bucket and permission boundary are derived from it using the fixed
      names in infrastructure/ci-bootstrap.yaml; backend/tests/test_ci_names.py keeps
      the two in sync.
    required: true
  photo-upload-origins:
    description: >-
      Comma-separated browser origins allowed to upload photos. Required: the template
      default only allows localhost, so leaving it empty would drop the hosted frontend's
      origin from the photo bucket CORS rules and break browser uploads.
    required: true
  region:
    default: us-east-1

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        PHOTO_UPLOAD_ORIGINS: ${{ inputs.photo-upload-origins }}
        ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
          echo "::error::The AWS_ACCOUNT_ID secret is missing or not a 12-digit account id. Set it with: gh secret set AWS_ACCOUNT_ID (see README, Set up the CI/CD pipeline)."
          exit 1
        fi
        # The template default only allows localhost. Deploying without the hosted frontend's
        # origin would silently break browser photo uploads, so require it for every environment.
        if [ -z "$PHOTO_UPLOAD_ORIGINS" ]; then
          echo "::error::Photo upload origins are not set. Set the DEV_PHOTO_UPLOAD_ORIGINS variable (PHOTO_UPLOAD_ORIGINS for prod) to the hosted frontend origin, e.g. https://<branch>.<amplify-app-id>.amplifyapp.com, optionally with http://localhost:5173."
          exit 1
        fi

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - uses: aws-actions/setup-sam@v3
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.account-id }}:role/saltracker-deploy-${{ inputs.environment }}
        aws-region: ${{ inputs.region }}
        mask-aws-account-id: true

    - name: Build
      shell: bash
      run: sam build --template-file infrastructure/template.yaml

    - name: Deploy
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        ARTIFACT_BUCKET: saltracker-sam-artifacts-${{ inputs.account-id }}-${{ inputs.region }}
        BOUNDARY_ARN: arn:aws:iam::${{ inputs.account-id }}:policy/saltracker-lambda-boundary-${{ inputs.environment }}
        PHOTO_UPLOAD_ORIGINS: ${{ inputs.photo-upload-origins }}
        REGION: ${{ inputs.region }}
      run: |
        overrides=("Environment=$ENVIRONMENT" "PermissionsBoundaryArn=$BOUNDARY_ARN" "PhotoUploadOrigins=\"$PHOTO_UPLOAD_ORIGINS\"")
        # --no-resolve-s3 and --region override the dev-only samconfig.toml, which turns on
        # resolve_s3 and pins us-east-1; the credentials and artifact bucket use inputs.region.
        sam deploy \
          --region "$REGION" \
          --stack-name "smart-asset-tracker-$ENVIRONMENT" \
          --s3-bucket "$ARTIFACT_BUCKET" --s3-prefix "$ENVIRONMENT" --no-resolve-s3 \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides "${overrides[@]}" \
          --no-confirm-changeset --no-fail-on-empty-changeset
